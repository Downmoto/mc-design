<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="620" viewBox="0 0 1580 620" role="img" aria-labelledby="title description">
  <title id="title">MemoryCore dark tonal surface palette</title>
  <desc id="description">Five dark theme surface levels from base through highest</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.42" />
    </filter>
  </defs>

  <rect width="1580" height="620" fill="#000000" />
  <rect x="22" y="16" width="1536" height="604" rx="32" fill="#050507" filter="url(#shadow)" />

  <g font-family="Inter, Roboto, Arial, sans-serif" font-size="28" fill="#E8E1D2">
    <text x="70" y="94">Base surface</text>
    <text x="1510" y="94" text-anchor="end" fill="#B8AE9D">#050507</text>

    <rect x="46" y="143" width="1488" height="88" rx="16" fill="#111015" />
    <text x="70" y="198">Surface low</text>
    <text x="1510" y="198" text-anchor="end" fill="#B8AE9D">#111015</text>

    <rect x="46" y="247" width="1488" height="88" rx="16" fill="#1C1A20" />
    <text x="70" y="302">Surface</text>
    <text x="1510" y="302" text-anchor="end" fill="#B8AE9D">#1C1A20</text>

    <rect x="46" y="351" width="1488" height="88" rx="16" fill="#29272E" />
    <text x="70" y="406">Surface high</text>
    <text x="1510" y="406" text-anchor="end" fill="#B8AE9D">#29272E</text>

    <rect x="46" y="455" width="1488" height="88" rx="16" fill="#36333C" />
    <text x="70" y="510">Surface highest</text>
    <text x="1510" y="510" text-anchor="end" fill="#B8AE9D">#36333C</text>

    <text x="46" y="587" fill="#B8AE9D">MemoryCore dark tonal surface palette</text>
  </g>
</svg>
